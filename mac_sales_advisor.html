<style>
  :root{

  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{padding:28px 20px 8px;text-align:center;}
  header h1{font-size:26px;margin:0 0 4px;}
  header p{color:var(--sub);margin:0;font-size:14px;}
  .wrap{max-width:820px;margin:0 auto;padding:20px;}
  .card{background:var(--card);border-radius:18px;padding:26px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:18px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
  .cat-btn{cursor:pointer;border:2px solid transparent;background:#fff;border-radius:16px;padding:22px 14px;text-align:center;font-size:16px;font-weight:600;transition:.15s;box-shadow:0 1px 6px rgba(0,0,0,.06);}
  .cat-btn:hover{transform:translateY(-3px);border-color:var(--apple-blue);}
  .progress{display:flex;gap:6px;margin-bottom:20px;}
  .progress div{flex:1;height:6px;border-radius:3px;background:#d2d2d7;}
  .progress div.active{background:var(--apple-blue);}
  .q-title{font-size:19px;font-weight:700;margin-bottom:16px;}
  .q-hint{color:var(--sub);font-size:13px;margin:-10px 0 16px;}
  .opt{display:block;width:100%;text-align:left;background:#f5f5f7;border:2px solid transparent;border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font-size:15px;transition:.12s;}
  .opt:hover{background:#eaeaec;}
  .opt.selected{border-color:var(--apple-blue);background:#e8f2fe;font-weight:600;}
  .btn-row{display:flex;justify-content:space-between;margin-top:20px;}
  button.nav{background:var(--apple-blue);color:#fff;border:none;padding:11px 22px;border-radius:22px;font-size:15px;cursor:pointer;}
  button.nav.secondary{background:#e5e5ea;color:var(--text);}
  button.nav:disabled{opacity:.4;cursor:not-allowed;}
  .tag{display:inline-block;background:#e8f2fe;color:var(--apple-blue);padding:5px 12px;border-radius:14px;font-size:13px;margin:3px 4px 3px 0;}
  .result-title{font-size:22px;font-weight:800;margin-bottom:4px;}
  .result-sub{color:var(--sub);margin-bottom:18px;font-size:14px;}
  .mac-box{background:linear-gradient(135deg,#f0f6ff,#e8f2fe);border-radius:16px;padding:20px;margin-bottom:20px;}
  .mac-name{font-size:24px;font-weight:800;color:var(--apple-blue);}
  .mac-scenario{color:var(--sub);font-size:14px;margin-top:4px;}
  .mac-price{color:var(--apple-blue);font-size:16px;font-weight:700;margin-top:8px;}
  .mac-edu-price{color:var(--green);font-size:16px;font-weight:700;margin-top:6px;}
  .edu-note{color:var(--sub);font-size:12px;margin:-10px 0 20px;line-height:1.5;}
  .alt-box{background:#f5f5f7;border-radius:14px;padding:16px 18px;margin-bottom:12px;}
  .alt-label{font-size:12px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
  .alt-name{font-size:16px;font-weight:700;color:var(--text);}
  .alt-price{font-size:14px;color:var(--purple);font-weight:600;margin-top:4px;}
  .alt-unavailable{color:var(--sub);font-size:14px;font-style:italic;}
  .bar-row{display:flex;align-items:center;margin-bottom:10px;font-size:14px;}
  .bar-label{width:130px;flex-shrink:0;}
  .bar-track{flex:1;background:#e5e5ea;border-radius:6px;height:14px;overflow:hidden;margin:0 10px;}
  .bar-fill{height:100%;border-radius:6px;}
  .bar-val{width:40px;text-align:right;color:var(--sub);font-size:13px;}
  .talk-list li{margin-bottom:8px;line-height:1.5;}
  .section-h{font-weight:700;font-size:15px;margin:18px 0 8px;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;}
  .pill-tools{margin-bottom:6px;}
  .breadcrumb{color:var(--sub);font-size:12px;margin-bottom:10px;}
  .restart{text-align:center;margin-top:10px;}
  .restart a{color:var(--apple-blue);cursor:pointer;font-size:14px;text-decoration:none;}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:10px 0 30px;}
</style>

  {label:"設計、影音創作", targets:["design","video"]},
  {label:"3D、建築、工程", targets:["d3"]}
];
const EDU_RESEARCH_MAP = [
  {label:"商管、資料分析", targets:["bizops","data"]},
  {label:"程式開發、AI", targets:["dev","ai"]},
  {label:"設計、影音創作", targets:["design","video"]},
  {label:"3D、建築、工程", targets:["d3"]},
  {label:"其他研究", targets:["office"]}
];

const DIM_LABEL = {CPU:"🧠 CPU",GPU:"🎮 GPU",Memory:"🧠 統一記憶體",Storage:"💾 儲存空間",Mobility:"💼 行動性",Display:"🖥️ 螢幕/擴充"};
const DIM_COLOR = {CPU:"#0071e3",GPU:"#ff3b30",Memory:"#34c759",Storage:"#ff9500",Mobility:"#af52de",Display:"#5ac8fa"};

const GROUPS = [
  {key:"office", icon:"👔", label:"上班族", desc:"日常辦公、商務營運、專案協作"},
  {key:"pro", icon:"🎯", label:"專業客戶", desc:"視覺設計、影音創作、軟體開發、AI／LLM、資料分析、3D／CAD／遊戲"},
  {key:"education", icon:"🎓", label:"教育", desc:"學生／教師，依學習或工作內容導流至對應類型"}
];

let state = {};
function initState(){
  state = {
    screen:"group", history:[],
    groupKey:null, catKey:null, isEdu:false,
    pendingTargets:null,
    tools:[], q2:null, q3:null
  };
}
initState();

function goTo(screen){ state.history.push(state.screen); state.screen = screen; render(); }
function goBack(){ const prev = state.history.pop(); if(prev!==undefined){ state.screen = prev; render(); } }
function resetState(){ initState(); render(); }

function render(){
  const app = document.getElementById('app');
  const s = state.screen;
  if(s==="group"){ app.innerHTML = renderGroupSelect(); attachGroupEvents(); return; }
  if(s==="cat"){ app.innerHTML = renderCatSelect(); attachCatEvents(); return; }
  if(s==="eduIdentity"){ app.innerHTML = renderEduIdentity(); attachEduIdentityEvents(); return; }
  if(s==="eduStudentQ2"){ app.innerHTML = renderEduContentPick("🎓 學生 — Q. 哪個最符合你的學習內容？", EDU_CONTENT_MAP, "studentPick"); attachEduPickEvents(EDU_CONTENT_MAP, "studentPick"); return; }
  if(s==="eduEducatorQ2"){ app.innerHTML = renderEduEducatorQ2(); attachEduEducatorQ2Events(); return; }
  if(s==="eduResearchQ3"){ app.innerHTML = renderEduContentPick("👩‍🏫 老師（研究）— Q. 你的研究內容偏向？", EDU_RESEARCH_MAP, "researchPick"); attachEduPickEvents(EDU_RESEARCH_MAP, "researchPick"); return; }
  if(s==="eduTargetPick"){ app.innerHTML = renderEduTargetPick(); attachEduTargetPickEvents(); return; }
  const cat = DATA[state.catKey];
  if(s==="tool"){ app.innerHTML = renderProgress(1) + renderQ1(cat); attachQ1Events(); return; }
  if(s==="q2"){ app.innerHTML = renderProgress(2) + renderQ2(cat); attachQ2Events(); return; }
  if(s==="q3"){ app.innerHTML = renderProgress(3) + renderQ3(cat); attachQ3Events(); return; }
  if(s==="result"){ app.innerHTML = renderResult(cat); attachResultEvents(); return; }
}

/* ---------- 族群選擇 ---------- */
function renderGroupSelect(){
  let html = '<div class="card"><div class="q-title">請選擇客戶的族群</div><div class="grid">';
  GROUPS.forEach(g=>{
    html += `<div class="cat-btn group-btn" data-key="${g.key}">${g.icon}<br>${g.label}<div style="font-weight:400;font-size:12px;color:var(--sub);margin-top:6px;">${g.desc}</div></div>`;
  });
  html += '</div></div>';
  return html;
}
function attachGroupEvents(){
  document.querySelectorAll('.group-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.key;
      state.groupKey = key;
      if(key==="education"){ goTo("eduIdentity"); }
      else { goTo("cat"); }
    });
  });
}

/* ---------- 一般類型選擇（上班族／專業客戶）---------- */
function renderCatSelect(){
  const group = GROUPS.find(g=>g.key===state.groupKey);
  let html = `<div class="card"><div class="q-title">${group.icon} ${group.label} — 請選擇工作類型</div><div class="grid">`;
  for(const key in DATA){
    const c = DATA[key];
    if(c.group !== state.groupKey) continue;
    html += `<div class="cat-btn" data-key="${key}">${c.icon}<br>${c.name}</div>`;
  }
  html += `</div><div class="btn-row"><button class="nav secondary" id="backBtn">← 返回族群選擇</button><div></div></div></div>`;
  return html;
}
function attachCatEvents(){
  document.querySelectorAll('.cat-btn').forEach(el=>{
    el.addEventListener('click', ()=>{ state.catKey = el.dataset.key; state.isEdu = false; goTo("tool"); });
  });
  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.addEventListener('click', goBack);
}

/* ---------- 教育導流 ---------- */
function renderEduIdentity(){
  return `<div class="card">
    <div class="q-title">🎓 教育 — 請選擇你的身份</div>
    <div class="opt edu-identity-opt" data-v="student">學生（Student）</div>
    <div class="opt edu-identity-opt" data-v="educator">老師（Educator）</div>
    <div class="btn-row"><button class="nav secondary" id="backBtn">← 返回族群選擇</button><div></div></div>
  </div>`;
}
function attachEduIdentityEvents(){
  document.querySelectorAll('.edu-identity-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(el.dataset.v==="student"){ goTo("eduStudentQ2"); }
      else { goTo("eduEducatorQ2"); }
    });
  });
  document.getElementById('backBtn').addEventListener('click', goBack);
}

function renderEduEducatorQ2(){
  return `<div class="card">
    <div class="q-title">👩‍🏫 老師 — 哪個最符合你的工作？</div>
    <div class="opt edu-educator-opt" data-v="prep">教學、備課</div>
    <div class="opt edu-educator-opt" data-v="admin">教學、行政管理</div>
    <div class="opt edu-educator-opt" data-v="research">教學、研究</div>
    <div class="btn-row"><button class="nav secondary" id="backBtn">← 返回</button><div></div></div>
  </div>`;
}
function attachEduEducatorQ2Events(){
  document.querySelectorAll('.edu-educator-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      const v = el.dataset.v;
      if(v==="prep"){ state.catKey="office"; state.isEdu=true; goTo("tool"); }
      else if(v==="admin"){ state.catKey="project"; state.isEdu=true; goTo("tool"); }
      else { goTo("eduResearchQ3"); }
    });
  });
  document.getElementById('backBtn').addEventListener('click', goBack);
}

function renderEduContentPick(title, map, screenName){
  let html = `<div class="card"><div class="q-title">${title}</div>`;
  map.forEach((m,i)=>{
    html += `<div class="opt edu-content-opt" data-i="${i}">${m.label}</div>`;
  });
  html += `<div class="btn-row"><button class="nav secondary" id="backBtn">← 返回</button><div></div></div></div>`;
  return html;
}
function attachEduPickEvents(map, screenName){
  document.querySelectorAll('.edu-content-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      const m = map[parseInt(el.dataset.i)];
      state.isEdu = true;
      if(m.targets.length===1){ state.catKey = m.targets[0]; goTo("tool"); }
      else { state.pendingTargets = m.targets; goTo("eduTargetPick"); }
    });
  });
  document.getElementById('backBtn').addEventListener('click', goBack);
}

function renderEduTargetPick(){
  let html = `<div class="card"><div class="q-title">請選擇更符合客戶需求的工作類型</div><div class="grid">`;
  state.pendingTargets.forEach(key=>{
    const c = DATA[key];
    html += `<div class="cat-btn" data-key="${key}">${c.icon}<br>${c.name}</div>`;
  });
  html += `</div><div class="btn-row"><button class="nav secondary" id="backBtn">← 返回</button><div></div></div></div>`;
  return html;
}
function attachEduTargetPickEvents(){
  document.querySelectorAll('.cat-btn').forEach(el=>{
    el.addEventListener('click', ()=>{ state.catKey = el.dataset.key; goTo("tool"); });
  });
  document.getElementById('backBtn').addEventListener('click', goBack);
}

/* ---------- 共用進度條 ---------- */
function renderProgress(n){
  let dots = '';
  for(let i=1;i<=3;i++){ dots += `<div class="${i<=n?'active':''}"></div>`; }
  return `<div class="card"><div class="progress">${dots}</div>`;
}

/* ---------- Q1 工具、Q2、Q3 ---------- */
function renderQ1(cat){
  let html = `<div class="q-title">Q1. 客戶最常使用哪些工具？（可複選）</div>`;
  cat.tools.forEach((t)=>{
    const sel = state.tools.includes(t) ? 'selected':'';
    html += `<div class="opt tool-opt ${sel}" data-tool="${t}">${t}</div>`;
  });
  html += `<div class="btn-row"><button class="nav secondary" id="backBtn">← 返回</button><button class="nav" id="nextBtn">下一題 →</button></div></div>`;
  return html;
}
function attachQ1Events(){
  document.querySelectorAll('.tool-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      const t = el.dataset.tool;
      const idx = state.tools.indexOf(t);
      if(idx>-1) state.tools.splice(idx,1); else state.tools.push(t);
      el.classList.toggle('selected');
    });
  });
  document.getElementById('backBtn').addEventListener('click', goBack);
  document.getElementById('nextBtn').addEventListener('click', ()=>{ goTo("q2"); });
}

function renderQ2(cat){
  let html = `<div class="q-title">Q2. 哪個最符合客戶的工作內容？</div>`;
  cat.q2.forEach((o,i)=>{
    const sel = state.q2===i ? 'selected':'';
    html += `<div class="opt q2-opt" data-i="${i}">${sel?'✅ ':''}${o}</div>`;
  });
  html += `<div class="btn-row"><button class="nav secondary" id="backBtn">← 返回</button><button class="nav" id="nextBtn" ${state.q2===null?'disabled':''}>下一題 →</button></div></div>`;
  return html;
}
function attachQ2Events(){
  document.querySelectorAll('.q2-opt').forEach(el=>{
    el.addEventListener('click', ()=>{ state.q2 = parseInt(el.dataset.i); render(); });
  });
  document.getElementById('backBtn').addEventListener('click', goBack);
  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ goTo("q3"); });
}

function renderQ3(cat){
  let html = `<div class="q-title">Q3. 哪句最符合客戶的工作負載？</div>`;
  cat.q3.forEach((o,i)=>{
    const sel = state.q3===i ? 'selected':'';
    html += `<div class="opt q3-opt" data-i="${i}">${sel?'✅ ':''}${o}</div>`;
  });
  html += `<div class="btn-row"><button class="nav secondary" id="backBtn">← 返回</button><button class="nav" id="nextBtn" ${state.q3===null?'disabled':''}>查看推薦 →</button></div></div>`;
  return html;
}
function attachQ3Events(){
  document.querySelectorAll('.q3-opt').forEach(el=>{
    el.addEventListener('click', ()=>{ state.q3 = parseInt(el.dataset.i); render(); });
  });
  document.getElementById('backBtn').addEventListener('click', goBack);
  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ goTo("result"); });
}

/* ---------- 結果 ---------- */
function computeTier(){
  return Math.max(state.q2, state.q3);
}
function scaleFactorForTier(tier){
  return [0.6, 0.85, 1.0][tier];
}

function renderResult(cat){
  const tier = computeTier();
  const rec = cat.recs[tier];
  const factor = scaleFactorForTier(tier);
  const dims = Object.keys(cat.baseline);
  const scored = dims.map(d=>({dim:d, score: Math.min(100, Math.round(cat.baseline[d]*factor))}));
  scored.sort((a,b)=>b.score-a.score);

  let barsHtml = '';
  dims.forEach(d=>{
    const score = Math.min(100, Math.round(cat.baseline[d]*factor));
    barsHtml += `<div class="bar-row">
      <div class="bar-label">${DIM_LABEL[d]}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${score}%;background:${DIM_COLOR[d]}"></div></div>
      <div class="bar-val">${score}%</div>
    </div>`;
  });

  let toolsHtml = state.tools.length
    ? `<div class="pill-tools">${state.tools.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`
    : `<div class="pill-tools" style="color:var(--sub);font-size:14px;">（未特別選擇工具）</div>`;

  const top3 = scored.slice(0,3);
  let talkHtml = '<ul class="talk-list">';
  top3.forEach(s=>{
    talkHtml += `<li><b>${DIM_LABEL[s.dim]}（${s.score}%）</b>：${cat.reasons[s.dim]}</li>`;
  });
  talkHtml += '</ul>';

  const breadcrumb = state.isEdu
    ? `<div class="breadcrumb">🎓 教育導流 → ${cat.icon} ${cat.name}</div>`
    : `<div class="breadcrumb">${GROUPS.find(g=>g.key===cat.group)?.icon||''} ${GROUPS.find(g=>g.key===cat.group)?.label||''} → ${cat.icon} ${cat.name}</div>`;

  return `
  <div class="card">
    ${breadcrumb}
    <div class="result-title">${cat.icon} ${cat.name} — 需求分析結果</div>
    <div class="result-sub">依據客戶回答自動計算</div>

    <div class="section-h">客戶常用工具</div>
    ${toolsHtml}

    <div class="mac-box">
      <div class="mac-scenario">適用情境：${rec.scenario}</div>
      <div class="mac-name">👉 ${rec.mac}</div>
      <div class="mac-price">💰 參考售價：${rec.price}</div>
      ${state.isEdu && rec.eduPrice ? `<div class="mac-edu-price">🎓 教育價：${rec.eduPrice}</div>` : ''}
    </div>
    ${state.isEdu && rec.eduPrice ? `<div class="edu-note">＊教育價需以有效學生／教職員身分驗證資格，實際優惠內容請以官網當期公告為準</div>` : ''}

    ${rec.desktop ? `
    <div class="section-h">🖥️ 桌機替代方案</div>
    <div class="alt-box">
      <div class="alt-label">Desktop Alternative</div>
      <div class="alt-name">${rec.desktop}</div>
      <div class="alt-price">💰 ${rec.desktopPrice}</div>
    </div>` : ''}

    ${rec.tablet ? `
    <div class="section-h">📱 平板替代方案</div>
    <div class="alt-box">
      <div class="alt-label">Tablet Alternative</div>
      ${rec.tablet === '—'
        ? `<div class="alt-unavailable">${rec.tabletPrice}</div>`
        : `<div class="alt-name">${rec.tablet}</div><div class="alt-price">💰 ${rec.tabletPrice}</div>`
      }
    </div>` : ''}

    <div class="section-h">工作需求分析（依權重模型推估）</div>
    ${barsHtml}

    <div class="section-h">建議銷售話術重點（最需要強調的優勢）</div>
    ${talkHtml}

    <div class="restart"><a id="restartBtn">🔄 重新開始 / 換一位客戶</a></div>
  </div>`;
}
function attachResultEvents(){
  document.getElementById('restartBtn').addEventListener('click', resetState);
}

render();
</script>
</body>
</html>
